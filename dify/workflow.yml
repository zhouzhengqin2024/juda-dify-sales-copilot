    - data:
        code: "import json\n\n\ndef main(arg1: str = \"\", arg2: str = \"\", price_body:\
          \ str = \"\", price_status: int = 0) -> dict:\n    version = (arg1 or \"\
          \").strip()\n    seats_text = (arg2 or \"\").strip()\n    if not version\
          \ and not seats_text:\n        return {\"result\": \"未申请模拟报价：报价版本和人数均未填写。\"\
          }\n    if not version or not seats_text:\n        return {\"result\": \"\
          暂不报价：请同时填写报价版本和人数。\"}\n    if not seats_text.isascii() or not seats_text.isdigit()\
          \ or len(seats_text) > 5:\n        return {\"result\": \"暂不报价：人数必须填写正整数。\"\
          }\n    seats = int(seats_text)\n    if seats < 1:\n        return {\"result\"\
          : \"暂不报价：人数必须填写正整数。\"}\n\n    unavailable = \"暂不报价：模拟价格表暂不可用或格式异常，请稍后重试并人工确认。\"\
          \n    if price_status != 200:\n        return {\"result\": unavailable}\n\
          \    try:\n        catalog = json.loads(price_body)\n        if (catalog.get(\"\
          schema_version\") != 1 or catalog.get(\"simulation\") is not True\n    \
          \            or catalog.get(\"currency\") != \"CNY\" or catalog.get(\"billing_period\"\
          ) != \"year\"\n                or not isinstance(catalog.get(\"catalog_version\"\
          ), str)\n                or not catalog[\"catalog_version\"].strip()):\n\
          \            return {\"result\": unavailable}\n        products = catalog[\"\
          products\"]\n        excluded = catalog[\"excluded\"]\n        if (not isinstance(products,\
          \ list) or not isinstance(excluded, list)\n                or not all(isinstance(x,\
          \ str) for x in excluded)):\n            return {\"result\": unavailable}\n\
          \        matching = [p for p in products if isinstance(p, dict) and p.get(\"\
          version\") == version]\n        if not matching:\n            return {\"\
          result\": \"暂不报价：模拟价格表没有该版本，不能借用其他版本的单价。\"}\n        if len(matching) !=\
          \ 1:\n            return {\"result\": unavailable}\n        item = matching[0]\n\
          \        minimum, maximum, unit_cents = item[\"min_seats\"], item[\"max_seats\"\
          ], item[\"unit_price_cents\"]\n        if (type(minimum) is not int or type(maximum)\
          \ is not int or type(unit_cents) is not int\n                or minimum\
          \ < 1 or maximum < minimum or unit_cents <= 0):\n            return {\"\
          result\": unavailable}\n        if not minimum <= seats <= maximum:\n  \
          \          return {\"result\": f\"暂不报价：{version}模拟价格仅适用{minimum}至{maximum}个坐席，当前输入{seats}人，需重新选型并人工评估。\"\
          }\n        amount_cents = seats * unit_cents\n        def money(cents):\n\
          \            return str(cents // 100) if cents % 100 == 0 else f\"{cents\
          \ // 100}.{cents % 100:02d}\"\n        omissions = \"、\".join(excluded)\
          \ if excluded else \"未列明\"\n        return {\"result\": (\n            f\"\
          教学模拟，非正式报价。价格表版本：{catalog['catalog_version']}。\"\n            f\"{version}，{seats}个坐席，单价{money(unit_cents)}元/坐席/年，\"\
          \n            f\"软件年费{money(amount_cents)}元人民币。\"\n            f\"不含：{omissions}。仅按单独填写的报价参数计算，不代表该版本满足客户全部需求；\"\
          \n            \"正式价格及完整费用范围需人工确认。\"\n        )}\n    except (ValueError,\
          \ TypeError, KeyError, AttributeError):\n        return {\"result\": unavailable}\n"
        code_language: python3
        desc: 模块三：从外部模拟价格表读取单价、版本和人数范围，按输入参数计算软件年费；不可用时不给金额。非正式报价。
        outputs:
          result:
            children: null
            type: string
